
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AI Study Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #ecfeff, #f8fafc);
            color: #172b4d;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: #fff;
            border: 1px solid #e8edf5;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(23, 43, 77, 0.12);
        }

        .icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border-radius: 20px;
            background: #e6fffb;
            color: #0f766e;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 12px;
            letter-spacing: -0.7px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
        }

        .primary-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0f766e;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .primary-btn:hover {
            background: #115e59;
            transform: translateY(-1px);
        }

        .message {
            padding: 13px 14px;
            margin-bottom: 22px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .error {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #0f766e;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .brand {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="icon">🔐</div>

        <h1>Forgot password?</h1>

        <p class="subtitle">
            No worries! Enter the email associated with your account.
            We'll help you get back to your study planner.
        </p>

        {% if message %}
        <div class="message {{ 'success' if success else 'error' }}" role="status">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/forgot-password">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <button class="primary-btn" type="submit">
                Send reset link →
            </button>
        </form>

        <a class="back-link" href="/login">← Back to login</a>

        <p class="brand">AI Study Planner · Your learning, organized.</p>
    </main>
</body>
</html>
