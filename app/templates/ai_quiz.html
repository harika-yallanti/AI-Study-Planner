<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Topic Quiz | AI Study Planner</title>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("studyPlannerTheme");

        if (savedTheme === "dark") {
            document.documentElement.classList.add("dark-theme");
        }
    })();
</script>

    
<style>
    :root {
        --quiz-bg: #f4f7fb;
        --quiz-card: #ffffff;
        --quiz-text: #172b4d;
        --quiz-muted: #64748b;
        --quiz-border: #e2e8f0;
        --quiz-option: #ffffff;
        --quiz-option-hover: #f0fdfa;
        --quiz-teal: #0f766e;
        --quiz-teal-light: #e6f5f2;
        --quiz-track: #e2e8f0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--quiz-bg);
        color: var(--quiz-text);
        min-height: 100vh;
        padding: 35px 20px;
        transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
        max-width: 850px;
        margin: 0 auto;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--quiz-teal);
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 25px;
        transition: color 0.2s ease;
    }

    .back-link:hover {
        color: #115e59;
    }

    .quiz-card {
        background: var(--quiz-card);
        border: 1px solid var(--quiz-border);
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 12px 35px rgba(23, 43, 77, 0.07);
        transition: background 0.25s ease, border-color 0.25s ease;
    }

    .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 24px;
    }

    .quiz-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--quiz-teal);
        background: var(--quiz-teal-light);
        padding: 9px 14px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    .score-label {
        color: var(--quiz-muted);
        font-size: 14px;
        font-weight: 700;
        background: var(--quiz-bg);
        padding: 9px 13px;
        border-radius: 10px;
    }

    #topic-title {
        color: var(--quiz-text);
        font-size: 29px;
        line-height: 1.35;
        margin-bottom: 20px !important;
        overflow-wrap: anywhere;
    }

    .progress-track {
        width: 100%;
        height: 10px;
        background: var(--quiz-track);
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 13px;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0f766e, #2dd4bf);
        border-radius: 20px;
        transition: width 0.4s ease;
    }

    .question-count {
        color: var(--quiz-muted);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 27px;
    }

    .question-title {
        color: var(--quiz-text);
        font-size: 23px;
        line-height: 1.55;
        font-weight: 700;
        margin-bottom: 25px;
        overflow-wrap: anywhere;
    }

    .options-grid {
        display: grid;
        gap: 13px;
    }

    .option-button {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        min-height: 62px;
        text-align: left;
        padding: 14px 17px;
        background: var(--quiz-option);
        border: 2px solid var(--quiz-border);
        border-radius: 15px;
        color: var(--quiz-text);
        font-size: 15px;
        line-height: 1.5;
        cursor: pointer;
        transition: border-color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
    }

    .option-button:hover:not(:disabled) {
        border-color: var(--quiz-teal);
        background: var(--quiz-option-hover);
        transform: translateY(-2px);
        box-shadow: 0 5px 14px rgba(15, 118, 110, 0.08);
    }

    .option-letter {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        background: var(--quiz-bg);
        color: var(--quiz-text);
        border: 1px solid var(--quiz-border);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 800;
        transition: all 0.2s ease;
    }

    .option-button.selected {
        border-color: var(--quiz-teal);
        background: var(--quiz-teal-light);
    }

    .option-button.selected .option-letter {
        background: var(--quiz-teal);
        color: white;
        border-color: var(--quiz-teal);
    }

    .option-button.correct {
        border-color: #16a34a;
        background: #f0fdf4;
        color: #166534;
    }

    .option-button.correct .option-letter {
        background: #16a34a;
        color: white;
        border-color: #16a34a;
    }

    .option-button.wrong {
        border-color: #dc2626;
        background: #fff1f2;
        color: #9f1239;
    }

    .option-button.wrong .option-letter {
        background: #dc2626;
        color: white;
        border-color: #dc2626;
    }

    .option-button:disabled {
        cursor: default;
    }

    .feedback {
        margin-top: 22px;
        padding: 18px 20px;
        border-radius: 14px;
        line-height: 1.7;
        font-size: 14px;
        display: none;
        animation: feedbackAppear 0.25s ease;
    }

    .feedback.correct-feedback {
        display: block;
        background: #f0fdf4;
        color: #166534;
        border: 1px solid #bbf7d0;
    }

    .feedback.wrong-feedback {
        display: block;
        background: #fff1f2;
        color: #9f1239;
        border: 1px solid #fecdd3;
    }

    .quiz-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-top: 30px;
    }

    .main-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        border: none;
        border-radius: 11px;
        padding: 13px 24px;
        background: linear-gradient(135deg, #0f766e, #0891b2);
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .main-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(15, 118, 110, 0.2);
    }

    .main-button:disabled {
        background: #cbd5e1;
        color: #ffffff;
        cursor: not-allowed;
        box-shadow: none;
    }

    .secondary-button {
        background: var(--quiz-card);
        color: var(--quiz-teal);
        border: 1px solid var(--quiz-teal);
    }

    .secondary-button:hover:not(:disabled) {
        background: var(--quiz-teal-light);
    }

    .results {
        display: none;
        text-align: center;
        padding: 25px 0;
    }

    .result-emoji {
        font-size: 68px;
        margin-bottom: 18px;
        animation: resultAppear 0.45s ease;
    }

    .result-title {
        color: var(--quiz-text);
        font-size: 30px;
        line-height: 1.4;
        margin-bottom: 12px;
    }

    .result-score {
        display: inline-block;
        color: var(--quiz-teal);
        background: var(--quiz-teal-light);
        border-radius: 16px;
        padding: 15px 25px;
        font-size: 38px;
        font-weight: 800;
        margin: 22px 0;
    }

    .result-message {
        color: var(--quiz-muted);
        line-height: 1.8;
        font-size: 15px;
        max-width: 520px;
        margin: 0 auto 25px;
    }

    .error-message {
        background: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3;
        border-radius: 14px;
        padding: 20px;
        line-height: 1.7;
    }

    @keyframes feedbackAppear {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes resultAppear {
        from {
            opacity: 0;
            transform: scale(0.8);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Dark theme */
    html.dark-theme,
    html.dark-theme body,
    body.dark-theme {
        --quiz-bg: #0f172a;
        --quiz-card: #1e293b;
        --quiz-text: #f1f5f9;
        --quiz-muted: #94a3b8;
        --quiz-border: #334155;
        --quiz-option: #1e293b;
        --quiz-option-hover: #263f4b;
        --quiz-teal-light: #123b3a;
        --quiz-track: #334155;
    }

    html.dark-theme .quiz-card,
    body.dark-theme .quiz-card {
        background: var(--quiz-card);
        border-color: var(--quiz-border);
    }

    html.dark-theme .option-button.correct,
    body.dark-theme .option-button.correct {
        background: #123b2a;
        color: #bbf7d0;
    }

    html.dark-theme .option-button.wrong,
    body.dark-theme .option-button.wrong {
        background: #451a24;
        color: #fecdd3;
    }

    html.dark-theme .feedback.correct-feedback,
    body.dark-theme .feedback.correct-feedback {
        background: #123b2a;
        color: #bbf7d0;
        border-color: #166534;
    }

    html.dark-theme .feedback.wrong-feedback,
    body.dark-theme .feedback.wrong-feedback {
        background: #451a24;
        color: #fecdd3;
        border-color: #9f1239;
    }

    @media (max-width: 600px) {
        body {
            padding: 18px 12px;
        }

        .quiz-card {
            padding: 22px;
            border-radius: 18px;
        }

        #topic-title {
            font-size: 23px;
        }

        .question-title {
            font-size: 20px;
        }

        .quiz-header {
            align-items: flex-start;
        }

        .quiz-footer {
            flex-direction: column;
            align-items: stretch;
        }

        .main-button {
            width: 100%;
        }

        .option-button {
            padding: 13px;
            gap: 12px;
        }

        .result-title {
            font-size: 25px;
        }

        .result-score {
            font-size: 32px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>

</head>

<body>
    <div class="container">

        <a href="/study-plan" class="back-link">
            &larr; Back to Study Plan
        </a>

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% else %}

            <div class="quiz-card">

                <!-- Topic ID is required when saving the quiz result -->
                <input
                    type="hidden"
                    id="quiz-topic-id"
                    value="{{ topic_id }}"
                >

                <div id="quiz-screen">

                    <div class="quiz-header">
                        <span class="quiz-label">🎯 Topic Challenge</span>

                        <span class="score-label">
                            Score: <span id="score">0</span>
                        </span>
                    </div>

                    <h1 id="topic-title" style="margin-bottom: 10px;">
                        {{ topic_name }}
                    </h1>

                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>

                    <p class="question-count" id="question-count"></p>

                    <h2 class="question-title" id="question-text"></h2>

                    <div class="options-grid" id="options-container"></div>

                    <div class="feedback" id="feedback"></div>

                    <div class="quiz-footer">
                        <button
                            type="button"
                            class="main-button secondary-button"
                            onclick="window.location.href='/study-plan'"
                        >
                            Exit Quiz
                        </button>

                        <button
                            type="button"
                            class="main-button"
                            id="next-button"
            disabled
                        >
                            Next Question →
                        </button>
                    </div>

                </div>

                <div class="results" id="results-screen">

                    <div class="result-emoji" id="result-emoji"></div>

                    <h2 class="result-title" id="result-title"></h2>

                    <p class="result-message" id="result-message"></p>

                    <div class="result-score" id="result-score"></div>

                    <button
                        type="button"
                        class="main-button"
                        onclick="window.location.href='/study-plan'"
                    >
                        Back to Study Plan
                    </button>

                </div>

            </div>

            <script id="quiz-data" type="application/json">
                {{ questions | tojson }}
            </script>

            <script>
                // Read the quiz questions generated by the backend.
                const questions = JSON.parse(
                    document.getElementById("quiz-data").textContent
                );

                const topicId = document.getElementById("quiz-topic-id").value;

                let currentQuestion = 0;
                let score = 0;
                let answered = false;
                let quizFinished = false;

                const questionText = document.getElementById("question-text");
                const optionsContainer = document.getElementById("options-container");
                const nextButton = document.getElementById("next-button");
                const feedback = document.getElementById("feedback");

                // Display the current question and its options.
                function loadQuestion() {
                    answered = false;

                    const question = questions[currentQuestion];

                    document.getElementById("question-count").textContent =
                        `Question ${currentQuestion + 1} of ${questions.length}`;

                    document.getElementById("progress-fill").style.width =
                        `${((currentQuestion+ 1) / questions.length) * 100}%`;

                    questionText.textContent = question.question;

                    optionsContainer.innerHTML = "";

                    feedback.className = "feedback";
                    feedback.textContent = "";

                    nextButton.disabled = true;

                    Object.entries(question.options).forEach(([letter, answer]) => {
                        const button = document.createElement("button");

                        button.type = "button";
                        button.className = "option-button";

                        const letterSpan = document.createElement("span");
                        letterSpan.className = "option-letter";
                        letterSpan.textContent = letter;

                        const answerSpan = document.createElement("span");
                        answerSpan.textContent = answer;

                        button.appendChild(letterSpan);
                        button.appendChild(answerSpan);

                        button.addEventListener("click", () => {
                            selectAnswer(letter, button);
                        });

                        optionsContainer.appendChild(button);
                    });
                }

                // Check the selected answer and show feedback.
                function selectAnswer(selectedLetter, selectedButton) {
                    if (answered || quizFinished) {
                        return;
                    }

                    answered = true;

                    const question = questions[currentQuestion];

                    const isCorrect =
                        selectedLetter === question.correct_answer;

                    document.querySelectorAll(".option-button").forEach(button => {
                        button.disabled = true;
                    });

                    if (isCorrect) {
                        score++;

                        selectedButton.classList.add("correct");

                        feedback.className = "feedback correct-feedback";

                        feedback.textContent =
                            "🎉 Correct! " + question.explanation;

                    } else {
                        selectedButton.classList.add("wrong");

                        feedback.className = "feedback wrong-feedback";

                        feedback.textContent =
                            "Not quite! The correct answer is " +
                            question.correct_answer + ". " +
                            question.options[question.correct_answer] +
                            ". " + question.explanation;

                        // Highlight the correct option.
                        document.querySelectorAll(".option-button").forEach(button => {
                            const letter =
                                button.querySelector(".option-letter").textContent;

                            if (letter === question.correct_answer) {
                                button.classList.add("correct");
                            }
                        });
                    }

                    document.getElementById("score").textContent = score;

                    nextButton.disabled = false;
                }

                // Move to the next question or show the final result.
                nextButton.addEventListener("click", () => {
                    if (!answered || quizFinished) {
                        return;
                    }

                    currentQuestion++;

                    if (currentQuestion < questions.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                });

                // Display the result and save the score to MySQL.
                async function showResults() {
                    if (quizFinished) {
                        return;
                    }

                    quizFinished = true;

                    document.getElementById("quiz-screen").style.display = "none";

                    const resultsScreen =
                        document.getElementById("results-screen");

                    resultsScreen.style.display = "block";

                    const percentage = Math.round(
                        (score / questions.length) * 100
                    );

                    document.getElementById("progress-fill").style.width = "100%";

                    document.getElementById("result-score").textContent =
                        `${score} / ${questions.length} (${percentage}%)`;

                    const resultMessage =
                        document.getElementById("result-message");

                    if (percentage >= 80) {
                        document.getElementById("result-emoji").textContent = "🏆";

                        document.getElementById("result-title").textContent =
                            "Excellent Work!";

                        resultMessage.textContent =
                            "You have a strong understanding of this topic. " +
                            "Keep up the great work!";

                    } else if (percentage >= 60) {
                        document.getElementById("result-emoji").textContent = "🌟";

                        document.getElementById("result-title").textContent =
                            "Good Job!";

                        resultMessage.textContent =
                            "You're making progress. Review the questions " +
                            "you missed and try again!";

                    } else {
                        document.getElementById("result-emoji").textContent = "💪";

                        document.getElementById("result-title").textContent =
                            "Keep Practicing!";

                        resultMessage.textContent =
                            "Every attempt helps you learn. Review this " +
                            "topic and give it another try!";
                    }

                    // Check that the topic ID is available.
                    if (!topicId) {
                        resultMessage.textContent +=
                            " Your result could not be saved because the topic ID is missing.";
                        return;
                    }

                    // Save the quiz score to the backend.
                    try {
                        const response = await fetch("/ai/save-quiz-score", {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },
                            body: new URLSearchParams({
                                topic_id: topicId,
                                score: score,
                                total_questions: questions.length
                            })
                        });

                        // Check whether the backend returned an error.
                        if (!response.ok) {
                            throw new Error("Score saving request failed.");
                        }

                        // Ensure the backend returned JSON.
                        const contentType =
                            response.headers.get("content-type") || "";

                        if (!contentType.includes("application/json")) {
                            throw new Error("Unexpected response from server.");
                        }

                        const result = await response.json();

                        if (result.success) {
                            resultMessage.textContent +=
                                " Your quiz result has been saved!";
                        } else {
                            resultMessage.textContent +=
                                " Your quiz result could not be saved. Please try again.";
                        }

                    } catch (error) {
                        console.error("Quiz score saving error:", error);

                        resultMessage.textContent +=
                            " Your quiz result could not be saved because of a connection error.";
                    }
                }

                // Handle a quiz that has no questions.
                if (questions.length > 0) {
                    loadQuestion();
                } else {
                    document.getElementById("quiz-screen").style.display = "none";

                    document.getElementById("results-screen").style.display = "block";

                    document.getElementById("result-emoji").textContent = "📘";

                    document.getElementById("result-title").textContent =
                        "No Questions Available";

                    document.getElementById("result-message").textContent =
                        "Please return to the study plan and generate the quiz again.";

                    document.getElementById("result-score").textContent = "";
                }
            </script>

        {% endif %}

    </div>
    <script src="/static/js/theme.js"></script>
</body>
</html>
